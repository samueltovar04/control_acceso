services:
  access_control_db:
    build:
      context: ./infrastructure/db
    image: control_acceso-db-pgvector:15-alpine
    container_name: access_control_db
    restart: always
    environment:
      POSTGRES_DB: access_control
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d access_control"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s

  mediamtx_gateway:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx_gateway
    restart: always
    volumes:
      - ./infrastructure/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"

  access_control_backend:
    build:
      context: ./control_server
      dockerfile: Dockerfile
    container_name: access_control_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://access_control_db:5432/access_control
      QUARKUS_DATASOURCE_USERNAME: admin
      QUARKUS_DATASOURCE_PASSWORD: adminpassword
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_HTTP_CORS_ORIGINS: "*"
      QUARKUS_MONGODB_CONNECTION_STRING: mongodb://biotrack_user:biotrack_secret123@biotrack_mongo:27017/biotrack_db?authSource=admin
      QUARKUS_MONGODB_DATABASE: biotrack_db
      QUARKUS_SMALLRYE_JWT_ENABLED: "false"
      MEDIAMTX_API_URL: http://mediamtx_gateway:9997
      CAMARA_RTSP_USER: ${CAM_RTSP_USER:-}
      CAMARA_RTSP_PASSWORD: ${CAM_RTSP_PASSWORD:-}
      CAMARA_RTSP_CHANNEL: ${CAM_RTSP_CHANNEL:-102}
    volumes:
      - /tmp:/host_tmp:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      access_control_db:
        condition: service_healthy
      biotrack_mongo:
        condition: service_started
      mediamtx_gateway:
        condition: service_started

  biotrack_mongo:
    image: mongo:6.0
    container_name: biotrack_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: biotrack_user
      MONGO_INITDB_ROOT_PASSWORD: biotrack_secret123
      MONGO_INITDB_DATABASE: biotrack_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  access_control_frontend:
    build:
      context: ./control_web
      dockerfile: Dockerfile
    container_name: access_control_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - access_control_backend

volumes:
  postgres_data:
  mongodb_data:
