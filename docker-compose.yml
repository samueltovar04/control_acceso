services:
  access_control_db:
    image: postgres:15-alpine
    container_name: access_control_db
    restart: always
    environment:
      POSTGRES_DB: access_control
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d access_control"]
      interval: 5s
      timeout: 5s
      retries: 5

  access_control_backend:
    build:
      context: ./control_server
      dockerfile: Dockerfile
    container_name: access_control_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://access_control_db:5432/access_control
      QUARKUS_DATASOURCE_USERNAME: admin
      QUARKUS_DATASOURCE_PASSWORD: adminpassword
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    depends_on:
      access_control_db:
        condition: service_healthy

  access_control_frontend:
    build:
      context: ./control_web
      dockerfile: Dockerfile
    container_name: access_control_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - access_control_backend

volumes:
  postgres_data:
