<div class="d-flex min-vh-100 bg-light position-relative">
  <!-- BACKDROP PARA DISPOSITIVOS MOVILES -->
  <div 
    class="sidebar-backdrop d-md-none" 
    *ngIf="sidebarService.isOpen()" 
    (click)="sidebarService.close()">
  </div>

  <!-- SIDEBAR LATERAL IZQUIERDO -->
  <aside 
    class="sidebar-container" 
    [class.sidebar-open]="sidebarService.isOpen()">
    <app-left-menu></app-left-menu>
  </aside>

  <!-- CONTENIDO CENTRAL Y TOPBAR -->
  <div class="d-flex flex-column flex-grow-1 overflow-hidden main-layout-content">
    <!-- TOPBAR SUPERIOR -->
    <app-topbar></app-topbar>

    <!-- ÁREA DE VISTA PRINCIPAL -->
    <main class="flex-grow-1 p-2 p-md-3 overflow-auto view-content-container">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
