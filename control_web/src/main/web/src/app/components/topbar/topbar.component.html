<div class="top-navbar px-3 px-md-4 py-2.5 d-flex justify-content-between align-items-center">
  <!-- BRANDING & TITULAR -->
  <div class="d-flex align-items-center">
    <!-- BOTÓN HAMBURGUESA MÓVIL -->
    <button
      class="btn btn-sm btn-dark border border-secondary d-md-none me-2 text-white shadow-sm px-2 py-1"
      (click)="sidebarService.toggle()"
      type="button"
      title="Alternar Menú"
      aria-label="Alternar Menú">
      <i class="bi bi-list fs-4"></i>
    </button>

    <div>
      <h6 class="m-0 fw-extrabold text-white text-truncate topbar-title" style="max-width: 260px; font-weight: 900;">
        {{ branding?.nombreEmpresa || 'Control de Acceso S.A.' }}
      </h6>
      <div class="d-flex align-items-center gap-1">
        <span class="status-online-dot"></span>
        <small class="text-info fw-bold d-none d-sm-inline topbar-subtitle" style="font-size: 0.72rem;">Clean Health Pro • V.2.0</small>
      </div>
    </div>
  </div>

  <!-- ESTADO DE LA RED Y USUARIO (PÍLDORAS ALTO CONTRASTE) -->
  <div class="d-flex align-items-center gap-2 gap-md-3">
    <!-- SELECTOR CENTRALIZADO DE SEDE -->
    <div class="d-flex align-items-center pill-white shadow-sm">
      <i class="bi bi-geo-alt-fill text-info me-1"></i>
      <span class="small fw-bold text-white-50 d-none d-lg-inline me-1 topbar-label">Sede:</span>
      <select class="form-select form-select-sm border-0 bg-transparent fw-bold text-white py-0 topbar-select"
              style="font-size: 0.85rem; cursor: pointer; min-width: 130px; max-width: 200px;"
              [disabled]="sedeBloqueada"
              [title]="sedeBloqueada ? 'Sede asignada a su usuario' : 'Filtrar por sede en todo el sistema'"
              [(ngModel)]="sedeSeleccionadaId"
              (ngModelChange)="onSedeChange($event)">
        <option *ngIf="!sedeBloqueada" [ngValue]="null" class="bg-dark text-white">Todas las Sedes</option>
        <ng-container *ngFor="let s of sedesList">
          <option *ngIf="!sedeBloqueada || s.id === sedeSeleccionadaId" [ngValue]="s.id" class="bg-dark text-white">
            {{ s.sede }}
          </option>
        </ng-container>
      </select>
    </div>

    <!-- WIDGET BCV MULTIMONEDA -->
    <div class="d-none d-lg-flex align-items-center pill-white shadow-sm gap-2">
      <div class="btn-group btn-group-sm p-0" role="group">
        <button type="button" class="btn btn-sm px-2 py-0.5 fw-bold rounded-pill"
                [class.btn-primary]="monedaActiva === 'USD'"
                [class.btn-outline-secondary]="monedaActiva !== 'USD'"
                (click)="monedaActiva = 'USD'">USD</button>
        <button type="button" class="btn btn-sm px-2 py-0.5 fw-bold rounded-pill ms-1"
                [class.btn-primary]="monedaActiva === 'EUR'"
                [class.btn-outline-secondary]="monedaActiva !== 'EUR'"
                (click)="monedaActiva = 'EUR'">EUR</button>
        <button type="button" class="btn btn-sm px-2 py-0.5 fw-bold rounded-pill ms-1"
                [class.btn-primary]="monedaActiva === 'VES'"
                [class.btn-outline-secondary]="monedaActiva !== 'VES'"
                (click)="monedaActiva = 'VES'">VES</button>
      </div>

      <span class="fw-extrabold text-white font-monospace topbar-rate-text" style="font-size: 0.85rem;">
        {{ monedaActiva === 'USD' ? (tasaService.tasaUsdSignal() || '---') : (tasaService.tasaEurSignal() || '---') }}
        <small class="text-info fw-bold">VES</small>
      </span>

      <button class="btn btn-link btn-sm p-0 text-info"
              [disabled]="tasaService.cargandoSignal()"
              (click)="tasaService.sincronizarMoneda(monedaActiva === 'VES' ? 'USD' : monedaActiva)"
              title="Sincronizar Tasa Oficial">
        <i class="bi bi-arrow-repeat fs-6" [class.spin-animation]="tasaService.cargandoSignal()"></i>
      </button>
    </div>

    <!-- TERMINAL RÁPIDA -->
    <a *ngIf="!authService.isCliente() || authService.isAdminOrSuperAdmin()" routerLink="/home/biometria-facial" class="btn btn-outline-info btn-sm rounded-pill fw-bold px-3 py-1.5 shadow-sm">
      <i class="bi bi-camera-video me-1"></i>
      <span class="d-none d-sm-inline">Terminal Visión</span>
    </a>

    <!-- PERFIL Y SALIR -->
    <div class="d-flex align-items-center border-start border-secondary ps-3 gap-2">
      <div class="user-profile-chip pill-white d-flex align-items-center gap-2 shadow-sm">
        <div class="avatar-circle rounded-circle d-flex align-items-center justify-content-center shadow-sm"
             style="width: 32px; height: 32px; font-size: 0.85rem; font-weight: 800; background: #0284c7; color: #ffffff;">
          {{ usuarioActivo.charAt(0).toUpperCase() }}
        </div>
        <div class="d-none d-sm-block me-1 text-start">
          <div class="small fw-bold text-white lh-1 topbar-user-name">{{ usuarioActivo }}</div>
          <small class="text-info fw-bold topbar-role-text" style="font-size: 0.68rem;">superadmin</small>
        </div>
      </div>
      <button class="btn btn-sm d-flex align-items-center gap-1 fw-bold px-2 px-md-3 py-1.5 shadow-sm rounded-pill"
              style="border: 1.5px solid #fecdd3; background-color: #fff1f2; color: #e11d48;"
              title="Cerrar Sesión del Sistema"
              (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-right fs-6"></i>
        <span class="d-none d-md-inline">Salir</span>
      </button>
    </div>
  </div>
</div>
