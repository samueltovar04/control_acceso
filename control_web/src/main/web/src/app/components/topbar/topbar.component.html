<div class="top-navbar bg-white border-bottom px-4 py-2 d-flex justify-content-between align-items-center shadow-sm">
  <!-- LOGO Y BRANDING -->
  <div class="d-flex align-items-center">
    <div class="brand-badge bg-primary text-white rounded p-2 me-2 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
      <i class="bi bi-shield-check fs-5"></i>
    </div>
    <div>
      <h6 class="m-0 fw-bold text-dark">{{ branding?.nombreEmpresa || 'Control de Acceso' }}</h6>
      <small class="text-muted font-monospace" style="font-size: 0.75rem;">V.2.0 • Sistema Centralizado</small>
    </div>
  </div>

  <!-- ESTADO DE LA RED Y USUARIO -->
  <div class="d-flex align-items-center gap-3">
    <!-- ESTATUS DE RED -->
    <div class="d-none d-md-flex align-items-center bg-light px-3 py-1 rounded-pill border">
      <span class="status-indicator me-2 bg-success rounded-circle" style="width: 8px; height: 8px;"></span>
      <span class="small text-secondary fw-semibold">Torniquetes Online (Wi-Fi Activo)</span>
    </div>

    <!-- TERMINAL RÁPIDA -->
    <a routerLink="/home/biometria-facial" class="btn btn-outline-primary btn-sm rounded-pill fw-bold">
      <i class="bi bi-camera-video me-1"></i> Terminal Visión
    </a>

    <!-- PERFIL Y SALIR -->
    <div class="d-flex align-items-center border-start ps-3">
      <div class="avatar-circle bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 34px; height: 34px;">
        <i class="bi bi-person-fill"></i>
      </div>
      <div class="d-none d-sm-block me-3 text-start">
        <div class="small fw-bold text-dark lh-1">{{ usuarioActivo }}</div>
        <small class="text-muted" style="font-size: 0.7rem;">Operador / Admin</small>
      </div>
      <button class="btn btn-light btn-sm text-danger rounded-circle p-2" title="Cerrar Sesión" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </div>
</div>
