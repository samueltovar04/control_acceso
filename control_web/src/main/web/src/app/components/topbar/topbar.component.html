<div class="top-navbar bg-white border-bottom px-2 px-md-4 py-2 d-flex justify-content-between align-items-center shadow-sm">
  <!-- LOGO Y BRANDING -->
  <div class="d-flex align-items-center">
    <!-- BOTON HAMBURGUESA MOVIL -->
    <button 
      class="btn btn-sm btn-light border d-md-none me-2 text-dark shadow-sm px-2 py-1" 
      (click)="sidebarService.toggle()" 
      type="button" 
      title="Alternar Menú"
      aria-label="Alternar Menú">
      <i class="bi bi-list fs-4"></i>
    </button>

    <div class="brand-badge bg-primary text-white rounded p-2 me-2 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
      <i class="bi bi-shield-check fs-5"></i>
    </div>
    <div>
      <h6 class="m-0 fw-bold text-dark text-truncate" style="max-width: 140px;">{{ branding?.nombreEmpresa || 'Control de Acceso' }}</h6>
      <small class="text-muted font-monospace d-none d-sm-inline" style="font-size: 0.75rem;">V.2.0 • Sistema Centralizado</small>
    </div>
  </div>

  <!-- ESTADO DE LA RED Y USUARIO -->
  <div class="d-flex align-items-center gap-2 gap-md-3">
    <!-- SELECTOR CENTRALIZADO DE SEDE -->
    <div class="d-flex align-items-center bg-light border rounded-pill px-2 px-md-3 py-1 shadow-sm">
      <i class="bi bi-geo-alt-fill text-primary me-1"></i>
      <span class="small fw-bold text-secondary d-none d-lg-inline me-1">Sede:</span>
      <select class="form-select form-select-sm border-0 bg-transparent fw-bold text-dark py-0" 
              style="font-size: 0.85rem; cursor: pointer; min-width: 140px; max-width: 220px;"
              [disabled]="sedeBloqueada"
              [title]="sedeBloqueada ? 'Sede asignada a su usuario' : 'Filtrar por sede en todo el sistema'"
              [(ngModel)]="sedeSeleccionadaId" 
              (ngModelChange)="onSedeChange($event)">
        <option [ngValue]="null">Todas las Sedes</option>
        <option *ngFor="let s of sedesList" [ngValue]="s.id">
          {{ s.sede }}
        </option>
      </select>
      <span *ngIf="sedeBloqueada" class="badge bg-secondary rounded-pill ms-1" title="Sede fijada por rol">
        <i class="bi bi-lock-fill text-white" style="font-size: 0.7rem;"></i>
      </span>
    </div>

    <!-- WIDGET BCV MULTIMONEDA -->
    <div class="d-none d-lg-flex align-items-center bg-light border rounded-pill px-3 py-1 shadow-sm gap-2">
      <div class="btn-group btn-group-sm p-0" role="group">
        <button type="button" class="btn btn-sm px-2 py-0 fw-bold" 
                [class.btn-primary]="monedaActiva === 'USD'" 
                [class.btn-outline-secondary]="monedaActiva !== 'USD'"
                (click)="monedaActiva = 'USD'">USD</button>
        <button type="button" class="btn btn-sm px-2 py-0 fw-bold" 
                [class.btn-primary]="monedaActiva === 'EUR'" 
                [class.btn-outline-secondary]="monedaActiva !== 'EUR'"
                (click)="monedaActiva = 'EUR'">EUR</button>
      </div>

      <span class="fw-bold text-dark font-monospace" style="font-size: 0.85rem;">
        {{ monedaActiva === 'USD' ? (tasaService.tasaUsdSignal() || '---') : (tasaService.tasaEurSignal() || '---') }}
        <small class="text-muted">VES</small>
      </span>

      <span class="badge rounded-circle p-1" 
            [class.bg-success]="tasaService.esTasaVigenteHoy()" 
            [class.bg-warning]="!tasaService.esTasaVigenteHoy()" 
            [title]="tasaService.esTasaVigenteHoy() ? 'Cotizacion Oficial al dia' : 'Cotizacion pendiente de sincronizar'">
        <i class="bi bi-clock-history text-white" style="font-size: 0.65rem;"></i>
      </span>

      <button class="btn btn-link btn-sm p-0 text-primary" 
              [disabled]="tasaService.cargandoSignal()" 
              (click)="tasaService.sincronizarMoneda(monedaActiva)" 
              title="Consultar DolarAPI y sincronizar">
        <i class="bi bi-arrow-repeat fs-6" [class.spin-animation]="tasaService.cargandoSignal()"></i>
      </button>
    </div>

    <!-- TERMINAL RÁPIDA -->
    <a routerLink="/home/biometria-facial" class="btn btn-outline-primary btn-sm rounded-pill fw-bold px-2 px-sm-3">
      <i class="bi bi-camera-video me-sm-1"></i>
      <span class="d-none d-sm-inline">Terminal Visión</span>
    </a>

    <!-- PERFIL Y SALIR -->
    <div class="d-flex align-items-center border-start ps-3 gap-2">
      <div class="avatar-circle bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center me-1" style="width: 34px; height: 34px;">
        <i class="bi bi-person-fill"></i>
      </div>
      <div class="d-none d-sm-block me-2 text-start">
        <div class="small fw-bold text-dark lh-1">{{ usuarioActivo }}</div>
        <small class="text-muted" style="font-size: 0.7rem;">Sesion Activa</small>
      </div>
      <button class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1 fw-bold px-2 px-md-3 py-1 shadow-sm"
              title="Cerrar Sesión del Sistema" 
              (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-right fs-6"></i>
        <span class="d-none d-md-inline">Cerrar Sesión</span>
      </button>
    </div>
  </div>
</div>
