<h3>Registrar Piso</h3>
<div [hidden]="submitted">
  <form (ngSubmit)="onSubmit()">
    <div class="row">

    <div class="col-md-4 col-sm-4 col-lg-4">

      <div class="form-group">
        <label for="piso">Piso:</label>
        <input type="text" class="form-control" id="piso" required [(ngModel)]="piso.piso" name="piso">
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción:</label>
        <input type="text" class="form-control" id="descripcion" required [(ngModel)]="piso.descripcion" name="descripcion">
      </div>

      <div class="form-group mb-3">
        <label for="sede_id" class="form-label fw-bold">Sede:</label>
        <select class="form-select" id="sede_id" [(ngModel)]="piso.sede_id" name="sede_id">
          <option [ngValue]="null">Seleccione una Sede...</option>
          <option *ngFor="let s of sedesList" [value]="s.id">
            {{ s.sede || s.nombre }}
          </option>
        </select>
      </div>

      <button type="submit" class="btn btn-success">Guardar</button>
    </div>
</div>
  </form>
</div>

<div [hidden]="!submitted">
  <h4>You submitted successfully!</h4>
</div>
