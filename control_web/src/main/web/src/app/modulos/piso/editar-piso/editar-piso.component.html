<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <a routerLink="/home/pisos" class="btn btn-outline-secondary btn-sm mb-2">
        <i class="pi pi-arrow-left me-1"></i>Volver a Pisos
      </a>
      <h2 class="mb-0 text-primary"><i class="pi pi-building me-2"></i>Modificar Piso / Nivel</h2>
      <p class="text-muted small mb-0">Actualizacion de parametros y descripcion de zona</p>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form (ngSubmit)="onSubmit()">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="piso" class="form-label fw-bold">Numero / Nombre de Piso:</label>
            <input type="text" class="form-control" id="piso" required [(ngModel)]="piso.piso" name="piso">
            <input type="hidden" id="id" [(ngModel)]="id" name="id">
          </div>

          <div class="col-md-4">
            <label for="descripcion" class="form-label fw-bold">Descripcion:</label>
            <input type="text" class="form-control" id="descripcion" required [(ngModel)]="piso.descripcion" name="descripcion">
          </div>

          <div class="col-md-4">
            <label for="area" class="form-label fw-bold">Area / Zona:</label>
            <input type="text" class="form-control" id="area" required [(ngModel)]="piso.area" name="area">
          </div>

          <div class="col-md-4">
            <label for="sede_id" class="form-label fw-bold">Sede:</label>
            <select class="form-select" id="sede_id" [(ngModel)]="piso.sede_id" name="sede_id">
              <option [ngValue]="null">Seleccione una Sede...</option>
              <option *ngFor="let s of sedesList" [value]="s.id">
                {{ s.sede || s.nombre }}
              </option>
            </select>
          </div>
        </div>

        <div class="mt-4 text-end">
          <a routerLink="/home/pisos" class="btn btn-secondary me-2">Cancelar</a>
          <button type="submit" class="btn btn-success">
            <i class="pi pi-save me-1"></i>Guardar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
