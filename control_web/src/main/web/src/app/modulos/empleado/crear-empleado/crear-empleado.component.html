<div class="container-fluid p-3">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold text-dark m-0"><i class="bi bi-person-plus-fill text-primary me-2"></i>Registrar Nuevo Empleado</h3>
      <p class="text-muted small m-0">Alta de personal con enrolamiento facial y digitalización de huellas</p>
    </div>
    <a routerLink="/home/empleados" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i> Volver al listado
    </a>
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="row g-4">
      <!-- DATOS GENERALES -->
      <div class="col-lg-6">
        <div class="card p-4 border-0 shadow-sm rounded-3 bg-white h-100">
          <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-card-heading me-2"></i>Información Personal y Laboral</h5>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Documento / Cédula</label>
              <input type="text" class="form-control" [(ngModel)]="employee.documento" name="documento" required placeholder="V-12345678">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Código Insignia / RFID</label>
              <input type="text" class="form-control" [(ngModel)]="employee.codigoInsignia" name="codigoInsignia" placeholder="TAG-889021">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Nombre</label>
              <input type="text" class="form-control" [(ngModel)]="employee.nombre" name="nombre" required placeholder="Nombre">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Apellido</label>
              <input type="text" class="form-control" [(ngModel)]="employee.apellido" name="apellido" required placeholder="Apellido">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Correo Electrónico</label>
              <input type="email" class="form-control" [(ngModel)]="employee.email" name="email" placeholder="empleado@empresa.com">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Teléfono de Contacto</label>
              <input type="text" class="form-control" [(ngModel)]="employee.telefono" name="telefono" placeholder="+58 412 0000000">
            </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Sexo</label>
                <select class="form-select" [(ngModel)]="employee.sexo" name="sexo">
                  <option value="M">Masculino</option>
                  <option value="F">Femenino</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Sede</label>
                <select class="form-select" [(ngModel)]="employee.sedeId" name="sedeId">
                  <option [ngValue]="null">Seleccionar Sede...</option>
                  <option *ngFor="let s of sedesList" [value]="s.id">{{ s.sede }}</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Gerencia / Dpto.</label>
                <select class="form-select" [(ngModel)]="employee.gerenciaId" name="gerenciaId">
                  <option [ngValue]="null">Seleccionar Gerencia...</option>
                  <option *ngFor="let g of gerenciasList" [value]="g.id">{{ g.gerencia }}</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Tipo de Contrato</label>
                <select class="form-select" [(ngModel)]="employee.tipoContratoId" name="tipoContratoId">
                  <option [ngValue]="null">Seleccionar Contrato...</option>
                  <option *ngFor="let c of contratosList" [value]="c.id">{{ c.contrato }}</option>
                </select>
              </div>
            </div>
          </div>
        </div>

      <!-- COMPONENTE BIOMÉTRICO (FACIAL + HUELLAS) -->
      <div class="col-lg-6">
        <app-biometric-capture
          titulo="Enrolamiento Biométrico del Empleado"
          (biometricDataChange)="onBiometricData($event)">
        </app-biometric-capture>

        <div class="card p-3 border-0 shadow-sm rounded-3 bg-white text-end">
          <div class="d-flex justify-content-end gap-2">
            <button type="button" routerLink="/home/empleados" class="btn btn-light px-4">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm" [disabled]="guardando">
              <i class="bi bi-save me-1"></i> {{ guardando ? 'Guardando...' : 'Guardar Empleado' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
